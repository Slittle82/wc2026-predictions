name: Update Leaderboard

# Rebuilds leaderboard-data.json + predictions.json whenever you edit results.json
# (or the script) on GitHub, on a daily schedule, and on demand from the Actions tab.
on:
  push:
    branches: [ main ]
    paths:
      - 'results.json'
      - 'calculate_scores.py'
      - '.github/workflows/update-leaderboard.yml'
  schedule:
    # Daily safety-net rebuilds (UTC). 06:00 UTC = 07:00 BST (after overnight games),
    # 21:00 UTC = 22:00 BST (after evening games). Keeps the board fresh even on
    # days no score is entered manually.
    - cron: '0 6 * * *'
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-leaderboard
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Calculate scores from live Google Sheet
        run: python3 calculate_scores.py

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add leaderboard-data.json predictions.json rank-history.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-update leaderboard ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git push
          fi
