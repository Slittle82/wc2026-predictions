<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Cup 2026 Prediction Contest - Leaderboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #2d3748;
            margin-bottom: 10px;
            font-size: 2em;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .stat-card {
            background: #f7fafc;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .stat-label {
            color: #718096;
            font-size: 0.85em;
            margin-bottom: 5px;
        }

        .stat-value {
            color: #2d3748;
            font-size: 1.5em;
            font-weight: 700;
        }

        .leaderboard-table {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            font-size: 0.9em;
        }

        th.center {
            text-align: center;
        }

        tbody tr {
            border-bottom: 1px solid #e2e8f0;
            transition: background-color 0.2s;
        }

        tbody tr:hover {
            background-color: #f7fafc;
        }

        tbody tr:last-child {
            border-bottom: none;
        }

        td {
            padding: 15px;
            color: #2d3748;
        }

        td.center {
            text-align: center;
        }

        .rank {
            font-weight: 700;
            color: #667eea;
            font-size: 1.1em;
        }

        .rank-1 { color: #f59e0b; }
        .rank-2 { color: #94a3b8; }
        .rank-3 { color: #cd7f32; }

        .name {
            font-weight: 600;
            color: #2d3748;
        }

        .points {
            font-weight: 700;
            color: #667eea;
            font-size: 1.1em;
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85em;
            font-weight: 600;
            margin: 0 2px;
        }

        .badge-3pt { background: #d1fae5; color: #065f46; }
        .badge-2pt { background: #dbeafe; color: #1e40af; }
        .badge-1pt { background: #fef3c7; color: #92400e; }

        .payment-status {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 5px;
        }

        .payment-yes { background: #10b981; }
        .payment-no { background: #ef4444; }

        .loading {
            text-align: center;
            padding: 40px;
            color: white;
            font-size: 1.2em;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }

        .last-updated {
            text-align: center;
            color: #718096;
            font-size: 0.85em;
            margin-top: 15px;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.5em;
            }

            th, td {
                padding: 10px 8px;
                font-size: 0.85em;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .hide-mobile {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏆 World Cup 2026 Prediction Contest</h1>
            <p style="color: #718096; margin-top: 10px;">Durham Football Lodge Charity Competition</p>
            
            <div class="stats">
                <div class="stat-card">
                    <div class="stat-label">Total Entries</div>
                    <div class="stat-value" id="total-entries">-</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Matches Completed</div>
                    <div class="stat-value" id="matches-completed">-</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Prize Pool</div>
                    <div class="stat-value" id="prize-pool">£-</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">To Charity</div>
                    <div class="stat-value" id="charity-amount">£-</div>
                </div>
            </div>
        </div>

        <div class="leaderboard-table">
            <div id="loading" class="loading">Loading leaderboard...</div>
            <div id="error" style="display: none;"></div>
            <table id="leaderboard" style="display: none;">
                <thead>
                    <tr>
                        <th>Rank</th>
                        <th>Name</th>
                        <th class="center">Total</th>
                        <th class="center hide-mobile">Match Pts</th>
                        <th class="center hide-mobile">Winner</th>
                        <th class="center">Performance</th>
                        <th class="center hide-mobile">Paid</th>
                    </tr>
                </thead>
                <tbody id="leaderboard-body">
                </tbody>
            </table>
        </div>

        <div class="last-updated" id="last-updated"></div>
    </div>

    <script>
        // Configuration
        const JSON_URL = 'leaderboard-data.json';  // Path to your JSON file
        const ENTRY_FEE = 10;  // Entry fee in pounds

        // Fetch and display leaderboard
        async function loadLeaderboard() {
            try {
                const response = await fetch(JSON_URL + '?t=' + new Date().getTime());
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                
                // Update stats
                document.getElementById('total-entries').textContent = data.total_entries;
                document.getElementById('matches-completed').textContent = 
                    `${data.matches_completed}/${data.total_matches}`;
                
                const totalPot = data.total_entries * ENTRY_FEE;
                const charityAmount = Math.floor(totalPot * 0.25);
                const winnerAmount = totalPot - charityAmount;
                
                document.getElementById('prize-pool').textContent = `£${winnerAmount}`;
                document.getElementById('charity-amount').textContent = `£${charityAmount}`;
                
                // Build leaderboard table
                const tbody = document.getElementById('leaderboard-body');
                tbody.innerHTML = '';
                
                data.leaderboard.forEach(entry => {
                    const row = document.createElement('tr');
                    
                    // Rank
                    const rankClass = entry.rank <= 3 ? `rank-${entry.rank}` : 'rank';
                    const rankCell = `<td class="${rankClass}">${entry.rank}</td>`;
                    
                    // Name
                    const nameCell = `<td class="name">${entry.name}</td>`;
                    
                    // Total points
                    const pointsCell = `<td class="center points">${entry.total_points}</td>`;
                    
                    // Match points (hide on mobile)
                    const matchPointsCell = `<td class="center hide-mobile">${entry.match_points}</td>`;
                    
                    // Winner points (hide on mobile)
                    const winnerPointsCell = `<td class="center hide-mobile">${entry.winner_points}</td>`;
                    
                    // Performance badges
                    const badges = `
                        <span class="badge badge-3pt">${entry.games_3pt}×3pt</span>
                        <span class="badge badge-2pt">${entry.games_2pt}×2pt</span>
                        <span class="badge badge-1pt">${entry.games_1pt}×1pt</span>
                    `;
                    const performanceCell = `<td class="center">${badges}</td>`;
                    
                    // Payment status (hide on mobile)
                    const paymentStatus = entry.payment && entry.payment.toLowerCase() !== 'no' && entry.payment.trim() !== '';
                    const paymentClass = paymentStatus ? 'payment-yes' : 'payment-no';
                    const paymentCell = `<td class="center hide-mobile"><span class="payment-status ${paymentClass}"></span></td>`;
                    
                    row.innerHTML = rankCell + nameCell + pointsCell + matchPointsCell + 
                                  winnerPointsCell + performanceCell + paymentCell;
                    
                    tbody.appendChild(row);
                });
                
                // Show table, hide loading
                document.getElementById('loading').style.display = 'none';
                document.getElementById('leaderboard').style.display = 'table';
                
                // Update timestamp
                const now = new Date().toLocaleString('en-GB', {
                    day: 'numeric',
                    month: 'short',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });
                document.getElementById('last-updated').textContent = `Last updated: ${now}`;
                
            } catch (error) {
                console.error('Error loading leaderboard:', error);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
                document.getElementById('error').className = 'error';
                document.getElementById('error').textContent = 
                    'Failed to load leaderboard. Please try again later.';
            }
        }

        // Load on page load
        loadLeaderboard();

        // Auto-refresh every 5 minutes
        setInterval(loadLeaderboard, 5 * 60 * 1000);
    </script>
</body>
</html>
